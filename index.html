<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="robots" content="noimageindex">
  <meta name="description" content="Explore Munich and Berlin for free: iconic spots, sunsets and side quests on one map.">
  <title>Go Places · Munich</title>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">📍</span>
      <div>
        <h1>Go Places</h1>
        <button id="city-btn" class="city-btn" aria-label="Change city" title="Change city"><span id="city-label">Munich, for free</span> <span class="city-caret">▾</span></button>
      </div>
    </div>
    <div class="topbar-right">
      <div class="explored" title="Spots you've marked as explored">
        <span id="explored-count">0</span>/<span id="total-count">0</span><span class="explored-word"> explored</span>
      </div>
    </div>
  </header>

  <nav class="themes" id="themes" aria-label="Themes"></nav>

  <main id="map" aria-label="Map of spots"></main>

  <div class="map-buttons">
    <button id="locate-btn" class="fab" aria-label="Show my location" title="Show my location">◎</button>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <button class="tab on" data-tab="map"><b aria-hidden="true">🗺️</b><span>Map</span></button>
    <button class="tab" data-tab="discover" hidden><b aria-hidden="true">✨</b><span>Discover</span></button>
    <button class="tab" data-tab="suggest" hidden><b aria-hidden="true">➕</b><span>Suggest</span></button>
    <button class="tab" data-tab="explorers" hidden><b aria-hidden="true">👥</b><span>Explorers</span></button>
    <button class="tab" data-tab="me" id="account-btn" hidden><b aria-hidden="true" class="tab-me-icon">🧭</b><span class="tab-me-label">Sign in</span></button>
  </nav>

  <section class="sheet" id="sheet" aria-hidden="true">
    <button class="sheet-close" id="sheet-close" aria-label="Close">✕</button>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <!-- Loads the chosen city's content files (see data/cities.js). -->
  <script src="data/cities.js"></script>
  <script src="data/discover.js"></script>
  <script src="data/social.js"></script>
  <script src="data/plan.js"></script>
  <script src="protect.js"></script>
  <script src="lightbox.js"></script>
  <script src="account.js"></script>
  <script src="discover.js"></script>
  <script src="knowledge.js"></script>
  <script src="social.js"></script>
  <script src="meta.js"></script>
  <script src="collections.js"></script>
  <script src="plan.js"></script>
  <script src="submissions.js"></script>
  <script src="app.js"></script>
</body>
</html>
